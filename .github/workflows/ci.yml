name: CI - Test & SonarQube

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-and-sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for accurate SonarQube blame and history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov
          # Install current package in editable mode if setup.py or pyproject.toml exists
          if [ -f setup.py ] || [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Run tests with coverage (produces coverage.xml)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest --cov=my_package --cov-report=xml:coverage.xml --junitxml=pytest-junit.xml

      - name: Upload test results (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            pytest-junit.xml
            coverage.xml

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          args: >
            -Dsonar.projectKey=my_package_project
            -Dsonar.sources=.
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.python.xunit.reportPath=pytest-junit.xml
            -Dsonar.exclusions=**/tests/**,**/venv/**,**/.git/**
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}