# Required
sonar.projectKey=your.project.key
sonar.projectName=My Python Project
sonar.sources=.
# If you don't want to scan tests/external folders, specify a narrower path:
# sonar.sources=my_package

# Tell Sonar where the coverage report will be (path produced by pytest-cov XML report)
sonar.python.coverage.reportPaths=coverage.xml

# Optional: set the language (Sonar usually autodetects)
sonar.language=py
